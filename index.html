<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tools — Launcher</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'/></svg>">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0d1117] text-slate-100 min-h-screen font-sans antialiased flex flex-col justify-between selection:bg-blue-600 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-[#161b22]/70 backdrop-blur sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand Title -->
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <i data-lucide="layers" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-base tracking-tight text-white">My Tools</h1>
          <p class="text-[11px] text-slate-400">Danh sách các tool web của tôi</p>
        </div>
      </div>

      <!-- Search & Add Actions -->
      <div class="flex items-center gap-3">
        <!-- Search bar -->
        <div class="relative w-44 sm:w-60">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input type="text" id="searchInput" placeholder="Tìm kiếm tool..." class="w-full pl-9 pr-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700/80 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
        </div>

        <!-- Add Button -->
        <button id="openAddModalBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium transition active:scale-95 shadow-sm">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Thêm Tool</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Tools Grid Container -->
  <main class="max-w-5xl w-full mx-auto px-4 py-8 flex-1">
    
    <!-- Header info count -->
    <div class="flex items-center justify-between mb-5">
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider" id="toolsCountText">0 Tool</span>
    </div>

    <!-- Grid Cards -->
    <div id="toolsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
      <!-- Tool cards rendered via JS -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16 border border-dashed border-slate-800 rounded-2xl bg-slate-900/30">
      <i data-lucide="inbox" class="w-8 h-8 text-slate-500 mx-auto mb-2"></i>
      <p class="text-sm font-medium text-slate-300">Không tìm thấy tool nào</p>
      <p class="text-xs text-slate-500 mt-1">Bấm nút "Thêm Tool" để bổ sung đường link mới</p>
    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/60 py-4 text-center text-xs text-slate-500">
    <div class="max-w-5xl mx-auto px-4 flex items-center justify-between">
      <span>My Tools Launcher</span>
      <span class="text-[11px] text-slate-500">Tự động cập nhật logo & lưu trên trình duyệt</span>
    </div>
  </footer>

  <!-- Simple Modal: Add / Edit Tool -->
  <div id="toolModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[#161b22] border border-slate-800 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">
      
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <h2 id="modalTitle" class="text-sm font-bold text-white">Thêm Tool Mới</h2>
        <button id="closeModalBtn" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="toolForm" class="p-4 space-y-3.5">
        <input type="hidden" id="toolId">

        <!-- Name -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Tên Tool <span class="text-rose-400">*</span></label>
          <input type="text" id="toolName" required placeholder="VD: UyOffice Info" class="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:border-blue-500 transition">
        </div>

        <!-- URL -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Đường dẫn Web (URL) <span class="text-rose-400">*</span></label>
          <input type="url" id="toolUrl" required placeholder="https://..." class="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:border-blue-500 transition">
        </div>

        <!-- Logo / Icon URL -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-medium text-slate-300">Logo / Icon (Tùy chọn)</label>
            <span class="text-[10px] text-slate-500">Tự nhận diện hoặc dán link ảnh</span>
          </div>
          <div class="flex gap-2">
            <input type="text" id="toolIcon" placeholder="https://.../logo.svg hoặc để trống để tự tìm" class="flex-1 px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:border-blue-500 transition">
            <button type="button" id="detectLogoBtn" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-[11px] font-medium transition flex items-center gap-1" title="Tự động kiểm tra và điền logo từ URL">
              <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-400"></i>
              <span>Tìm Logo</span>
            </button>
          </div>
        </div>

        <!-- Short Description -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Ghi chú / Mô tả ngắn</label>
          <textarea id="toolDesc" rows="2" placeholder="Ghi chú về chức năng của tool..." class="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:border-blue-500 transition resize-none"></textarea>
        </div>

        <!-- Form Actions -->
        <div class="pt-2 flex items-center justify-end gap-2">
          <button type="button" id="cancelModalBtn" class="px-3.5 py-1.5 rounded-xl border border-slate-700 hover:bg-slate-800 text-slate-300 text-xs font-medium transition">
            Hủy
          </button>
          <button type="submit" class="px-3.5 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium transition">
            Lưu Tool
          </button>
        </div>
      </form>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
